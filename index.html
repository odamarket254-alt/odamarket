<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    
    <!-- Primary Meta Tags -->
    <title>OdaMarket - Premium B2B Marketplace</title>
    <meta name="description" content="OdaMarket is a leading premium B2B marketplace to find active suppliers, request quotations, and discover high-quality products." />
    <meta name="theme-color" content="#2E5E3E" />
    <link rel="canonical" href="https://odamarket.co.ke" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon and Touch Icons -->
    <link rel="icon" type="image/jpeg" href="/images/oda-logo.png.jpeg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Preconnect & Preload Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://odamarket.co.ke" />
    <meta property="og:title" content="OdaMarket - Premium B2B Marketplace" />
    <meta property="og:description" content="OdaMarket is a leading premium B2B marketplace to find active suppliers, request quotations, and discover high-quality products." />
    <meta property="og:image" content="https://odamarket.co.ke/images/oda-logo.png.jpeg" />
    <meta property="og:site_name" content="OdaMarket" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OdaMarket - Premium B2B Marketplace" />
    <meta name="twitter:description" content="OdaMarket is a leading premium B2B marketplace to find active suppliers, request quotations, and discover high-quality products." />
    <meta name="twitter:image" content="https://odamarket.co.ke/images/oda-logo.jpeg" />

    <!-- Organization Schema (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "OdaMarket",
        "url": "https://odamarket.co.ke",
        "logo": "https://odamarket.co.ke/images/oda-logo.jpeg"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        console.error('Global error caught:', event.error);
        if (!document.getElementById('root').innerHTML) {
          document.getElementById('root').innerHTML = '<div style="padding: 20px; font-family: sans-serif; color: red;"><h2>Application Error</h2><p>' + (event.error ? event.error.message : event.message) + '</p></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        // console.error('Unhandled promise rejection caught:', event.reason?.message || event.reason);
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
