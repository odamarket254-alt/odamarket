<!DOCTYPE html>
<html>
<head>
<style>
  body { background-color: #FFFDF8; padding: 50px; }
  .logo { height: 100px; mix-blend-multiply; }
  .filter1 { filter: contrast(1.1) brightness(1.05); }
  .filter2 { filter: contrast(1.2) brightness(1.1); }
  .filter3 { filter: contrast(1.3) brightness(1.15); }
</style>
</head>
<body>
  <div>Original: <img class="logo" src="public/images/oda-logo.jpeg"></div>
  <div>Filter 1: <img class="logo filter1" src="public/images/oda-logo.jpeg"></div>
  <div>Filter 2: <img class="logo filter2" src="public/images/oda-logo.jpeg"></div>
  <div>Filter 3: <img class="logo filter3" src="public/images/oda-logo.jpeg"></div>
</body>
</html>
