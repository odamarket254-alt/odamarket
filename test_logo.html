<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #f0f0f0; padding: 50px; }
  .logo-container {
    width: 160px;
    height: auto;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-img {
    width: 100%;
    height: auto;
    object-fit: contain;
    mix-blend-mode: multiply;
    transform: scale(1.4); /* scale to crop margins */
  }
</style>
</head>
<body>
  <div class="logo-container">
    <img src="public/images/oda-logo.png.jpeg" class="logo-img">
  </div>
</body>
</html>
